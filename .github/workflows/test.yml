name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.26.10', '1.27.3']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - name: Check module files are tidy
        run: go mod tidy -diff
      # Verify the vendored GS1 TDT artefacts still match the pinned digests.
      # This step reads local files only; tdtsync reaches the network only with
      # -update, which a maintainer runs deliberately.
      - name: Verify pinned TDT artefacts
        run: go run ./tools/tdtsync
      # Generated scheme metadata must be a pure function of those artefacts.
      - name: Verify generated TDT metadata
        run: |
          go generate ./internal/tdt/...
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      # Pinned rather than added to go.mod. staticcheck v0.8.1 cannot read
      # Go 1.27 export data, and one toolchain is enough for static analysis.
      - name: Static analysis
        if: matrix.go-version == '1.26.10'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      # Scanned per toolchain, because standard-library vulnerabilities
      # depend on the Go release that builds the binaries.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # One run covers every package, fuzz seed corpora, goleak checks, and
      # the end-to-end scenarios.
      - name: Test with race detector
        run: go test -race ./...

  # The rig image copies the module at build time, so a broken Dockerfile
  # shows up here rather than for the first person who builds it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the tagstrak-rig image
        run: docker build -f build/tagstrak-rig/Dockerfile -t tagstrak-rig .
      - name: Run the image
        run: docker run --rm tagstrak-rig uii epc --scheme sgtin-96 --company-prefix 0614141 --item-ref 812345 --serial 1
