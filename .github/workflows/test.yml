name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.26.10', '1.27.3']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      # Verify the vendored GS1 TDT artefacts still match the pinned digests.
      # This step reads local files only; tdtsync reaches the network only with
      # -update, which a maintainer runs deliberately.
      - name: Verify pinned TDT artefacts
        run: go run ./tools/tdtsync
      # Generated scheme metadata must be a pure function of those artefacts.
      - name: Verify generated TDT metadata
        run: |
          go generate ./internal/tdt/...
          git diff --exit-code
      - name: Test
        run: go test ./...
      - name: Test with race detector
        run: go test -race ./internal/tdt/... ./internal/identity/... ./internal/filter/... ./internal/config/... ./internal/control/... ./internal/report/... ./internal/app/... ./internal/e2e/...
