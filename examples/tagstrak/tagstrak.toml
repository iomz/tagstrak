# Example tagstrak configuration, a working pair with the tagstrak-rig example
# scenario, whose tags match both subscriptions below. From the repository root:
#
#   go run ./cmd/tagstrak-rig simulator --scenario examples/rig/scenario.json
#   ERP_TOKEN=... go run ./cmd/tagstrak --config examples/tagstrak/tagstrak.toml
#
# Reports go to http://127.0.0.1:9000/rfid; any HTTP endpoint that answers a
# POST with 2xx can receive them (see docs/report.md for the JSON schema).
#
# Settings apply in order: defaults, this file, TAGSTRAK_* environment
# variables, flags. Secrets come only from env or file sources, never from
# this file, so it is safe to commit.
version = 1

[reader]
address = "127.0.0.1:5084"
source = "dock-1"

[telemetry]
address = "127.0.0.1:8080"

[report]
flush_interval = "1s"

# Optional management API. A Unix socket trusts the same user; a loopback
# address requires a token of at least 32 bytes. Remote addresses are refused.
# [control]
# socket = "/run/tagstrak/control.sock"
# address = "127.0.0.1:9090"
# [control.token]
# file = "/run/secrets/tagstrak-control"

[[destinations]]
name = "erp"
url = "http://127.0.0.1:9000/rfid"

# The header value is "Bearer " followed by the ERP_TOKEN environment
# variable. Use file = "/run/secrets/erp-token" for a file source instead;
# the file must not be readable by group or others.
[destinations.headers.Authorization]
env = "ERP_TOKEN"
prefix = "Bearer "

[[subscriptions]]
id = "product"
patterns = ["urn:epc:idpat:sgtin:0614141.812345.*"]
destinations = ["erp"]

[[subscriptions]]
id = "pallets"
patterns = ["urn:epc:idpat:sscc:0614141.*"]
destinations = ["erp"]

# A subscription may omit destinations; its matches are then only logged at
# debug level.
